name: Mobile UI checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ui-checks.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ui-checks.yml'

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export:web
      - run: npm run export:native
