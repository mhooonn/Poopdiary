name: Bowel API checks

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/bowel-api-checks.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/bowel-api-checks.yml']

permissions:
  contents: read

jobs:
  bowel-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
